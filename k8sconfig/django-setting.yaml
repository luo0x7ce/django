apiVersion: v1
data:
  settings.py: "\"\"\"\r\nDjango settings for mysite3 project.\r\n\r\nGenerated by
    'django-admin startproject' using Django 4.2.\r\n\r\nFor more information on this
    file, see\r\nhttps://docs.djangoproject.com/en/4.2/topics/settings/\r\n\r\nFor
    the full list of settings and their values, see\r\nhttps://docs.djangoproject.com/en/4.2/ref/settings/\r\n\"\"\"\r\n\r\nfrom
    pathlib import Path\r\nimport os\r\n\r\n# 尝试加载dotenv，如果不可用则跳过\r\ntry:\r\n    from
    dotenv import load_dotenv\r\n    load_dotenv()\r\nexcept ImportError:\r\n    pass\r\n\r\n#
    Build paths inside the project like this: BASE_DIR / 'subdir'.\r\nBASE_DIR = Path(__file__).resolve().parent.parent\r\n\r\n\r\n#
    Quick-start development settings - unsuitable for production\r\n# See https://docs.djangoproject.com/en/4.2/howto/deployment/checklist/\r\n\r\n#
    SECURITY WARNING: keep the secret key used in production secret!\r\nSECRET_KEY
    = os.getenv('DJANGO_SECRET_KEY', 'django-insecure-fallback-key-change-in-production')\r\n\r\n#
    SECURITY WARNING: don't run with debug turned on in production!\r\nDEBUG = os.getenv('DEBUG',
    'True') == 'True'\r\n\r\nALLOWED_HOSTS = os.getenv('ALLOWED_HOSTS', 'localhost,127.0.0.1').split(',')\r\n\r\n#
    Application definition\r\n\r\nINSTALLED_APPS = [\r\n    'django.contrib.admin',\r\n
    \   'django.contrib.auth',\r\n    'django.contrib.contenttypes',\r\n    'django.contrib.sessions',\r\n
    \   'django.contrib.messages',\r\n    'django.contrib.staticfiles',\r\n    'music',\r\n
    \   'new',\r\n    'bookstore'\r\n]\r\nAPPEND_SLASH = False\r\nMIDDLEWARE = [\r\n
    \   'django.middleware.security.SecurityMiddleware',\r\n    'django.contrib.sessions.middleware.SessionMiddleware',\r\n
    \   'django.middleware.common.CommonMiddleware',\r\n    'django.middleware.csrf.CsrfViewMiddleware',\r\n
    \   'django.contrib.auth.middleware.AuthenticationMiddleware',\r\n    'django.contrib.messages.middleware.MessageMiddleware',\r\n
    \   'django.middleware.clickjacking.XFrameOptionsMiddleware',\r\n]\r\n\r\nROOT_URLCONF
    = 'mysite3.urls'\r\n\r\nTEMPLATES = [\r\n    {\r\n        'BACKEND': 'django.template.backends.django.DjangoTemplates',\r\n
    \       'DIRS': [os.path.join(BASE_DIR,'templates')],\r\n        'APP_DIRS': True,\r\n
    \       'OPTIONS': {\r\n            'context_processors': [\r\n                'django.template.context_processors.debug',\r\n
    \               'django.template.context_processors.request',\r\n                'django.contrib.auth.context_processors.auth',\r\n
    \               'django.contrib.messages.context_processors.messages',\r\n            ],\r\n
    \       },\r\n    },\r\n]\r\n\r\nWSGI_APPLICATION = 'mysite3.wsgi.application'\r\n\r\n\r\n#
    Database\r\n# https://docs.djangoproject.com/en/4.2/ref/settings/#databases\r\n\r\nDATABASES
    = {\r\n    'default': {\r\n        'ENGINE': 'django.db.backends.mysql',\r\n        'NAME':
    os.getenv('MYSQL_DATABASE', 'mysite3'),\r\n        'USER': os.getenv('MYSQL_USER',
    'root'),\r\n        'PASSWORD': os.getenv('MYSQL_PASSWORD', '123456'),\r\n        'HOST':
    os.getenv('MYSQL_HOST', 'mysql1.default.svc.luowei.com'),\r\n        'PORT': os.getenv('MYSQL_PORT',
    '3306'),\r\n        'OPTIONS': {\r\n            'charset': 'utf8mb4',\r\n        },\r\n
    \   }\r\n}\r\n\r\n\r\n\r\n# Password validation\r\n# https://docs.djangoproject.com/en/4.2/ref/settings/#auth-password-validators\r\n\r\nAUTH_PASSWORD_VALIDATORS
    = [\r\n    {\r\n        'NAME': 'django.contrib.auth.password_validation.UserAttributeSimilarityValidator',\r\n
    \   },\r\n    {\r\n        'NAME': 'django.contrib.auth.password_validation.MinimumLengthValidator',\r\n
    \   },\r\n    {\r\n        'NAME': 'django.contrib.auth.password_validation.CommonPasswordValidator',\r\n
    \   },\r\n    {\r\n        'NAME': 'django.contrib.auth.password_validation.NumericPasswordValidator',\r\n
    \   },\r\n]\r\n\r\n\r\n# Internationalization\r\n# https://docs.djangoproject.com/en/4.2/topics/i18n/\r\n\r\nLANGUAGE_CODE
    = 'zh-Hans'\r\n\r\nTIME_ZONE = 'Asia/Shanghai'\r\n\r\nUSE_I18N = True\r\n\r\nUSE_TZ
    = True\r\n\r\nSTATIC_ROOT = os.path.join(BASE_DIR, 'static1')\r\n# Static files
    (CSS, JavaScript, Images)\r\n# https://docs.djangoproject.com/en/4.2/howto/static-files/\r\n\r\nSTATIC_URL
    = '/statics/'\r\nSTATICFILES_DIRS=(os.path.join(BASE_DIR,'static'),)\r\n\r\n#
    Default primary key field type\r\n# https://docs.djangoproject.com/en/4.2/ref/settings/#default-auto-field\r\n\r\nDEFAULT_AUTO_FIELD
    = 'django.db.models.BigAutoField'\r\n"
kind: ConfigMap
metadata:
  name: django-config
