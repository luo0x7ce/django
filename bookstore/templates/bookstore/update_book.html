{% extends 'bookstore/base.html' %}
{% load static %}

{% block title %}编辑图书{% endblock %}

{% block breadcrumb %}
<nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{% url 'bookstore:first_page' %}"><i class="bi bi-house"></i></a></li>
        <li class="breadcrumb-item"><a href="{% url 'bookstore:index' %}">图书管理</a></li>
        <li class="breadcrumb-item active">编辑图书</li>
    </ol>
</nav>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">
                    <i class="bi bi-pencil"></i> 编辑图书信息
                </h5>
            </div>
            <div class="card-body">
                <form method="post" action="{% url 'bookstore:update_book' book.id %}">
                    {% csrf_token %}

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="title" class="form-label">书名 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="title" name="title" value="{{ book.title }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="isbn" class="form-label">ISBN</label>
                            <input type="text" class="form-control" id="isbn" name="isbn" value="{{ book.isbn|default:'' }}">
                        </div>

                        <div class="col-md-6">
                            <label for="author" class="form-label">作者（选择）</label>
                            <select class="form-select" id="author" name="author">
                                <option value="">-- 选择已有作者 --</option>
                                {% for author in authors %}
                                <option value="{{ author.id }}" {% if book.author_id == author.id %}selected{% endif %}>{{ author.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="author_name" class="form-label">作者名称</label>
                            <input type="text" class="form-control" id="author_name" name="author_name" value="{{ book.author_name|default:'' }}">
                        </div>

                        <div class="col-md-6">
                            <label for="publisher" class="form-label">出版社 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="publisher" name="publisher" value="{{ book.publisher|default:'' }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="category" class="form-label">分类</label>
                            <select class="form-select" id="category" name="category">
                                <option value="other" {% if book.category == 'other' %}selected{% endif %}>其他</option>
                                <option value="fiction" {% if book.category == 'fiction' %}selected{% endif %}>小说</option>
                                <option value="science" {% if book.category == 'science' %}selected{% endif %}>科学</option>
                                <option value="technology" {% if book.category == 'technology' %}selected{% endif %}>技术</option>
                                <option value="history" {% if book.category == 'history' %}selected{% endif %}>历史</option>
                                <option value="art" {% if book.category == 'art' %}selected{% endif %}>艺术</option>
                                <option value="education" {% if book.category == 'education' %}selected{% endif %}>教育</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label for="price" class="form-label">价格 <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text">¥</span>
                                <input type="number" class="form-control" id="price" name="price" step="0.01" value="{{ book.price }}" required>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label for="market_price" class="form-label">零售价</label>
                            <div class="input-group">
                                <span class="input-group-text">¥</span>
                                <input type="number" class="form-control" id="market_price" name="market_price" step="0.01" value="{{ book.market_price }}">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label for="total_copies" class="form-label">总库存 <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="total_copies" name="total_copies" min="0" value="{{ book.total_copies }}" required>
                        </div>

                        <div class="col-md-6">
                            <label for="available_copies" class="form-label">可借数量</label>
                            <input type="number" class="form-control" id="available_copies" name="available_copies" min="0" value="{{ book.available_copies }}">
                        </div>
                        <div class="col-md-6">
                            <label for="shelf_location" class="form-label">书架位置</label>
                            <input type="text" class="form-control" id="shelf_location" name="shelf_location" value="{{ book.shelf_location }}">
                        </div>

                        <div class="col-12">
                            <label for="record" class="form-label">登记人</label>
                            <input type="text" class="form-control" id="record" name="record" value="{{ book.record }}">
                        </div>
                    </div>

                    <hr class="my-4">

                    <div class="d-flex justify-content-between">
                        <a href="{% url 'bookstore:index' %}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> 返回
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle"></i> 保存修改
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
