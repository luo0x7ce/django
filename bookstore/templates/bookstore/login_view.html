{% extends 'bookstore/base.html' %}
{% load static %}

{% block title %}登录{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <i class="bi bi-book"></i>
            <h2>智慧图书馆管理系统</h2>
            <p class="text-white opacity-75">欢迎登录，请输入您的账号信息</p>
        </div>
        <div class="auth-body">
            <form method="post" action="{% url 'bookstore:login' %}">
                {% csrf_token %}

                {% if form.non_field_errors %}
                <div class="alert alert-danger">
                    {% for error in form.non_field_errors %}
                    <i class="bi bi-exclamation-circle"></i> {{ error }}
                    {% endfor %}
                </div>
                {% endif %}

                <div class="mb-3">
                    <label for="username" class="form-label">
                        <i class="bi bi-person me-1"></i>用户名
                    </label>
                    <input type="text" class="form-control" id="username" name="username"
                           value="{{ form.username.value|default:'' }}"
                           placeholder="请输入用户名" required autofocus>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">
                        <i class="bi bi-lock me-1"></i>密码
                    </label>
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="请输入密码" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 mb-3">
                    <i class="bi bi-box-arrow-in-right"></i> 登录
                </button>

                <div class="d-flex justify-content-between text-muted small">
                    <a href="{% url 'bookstore:register' %}" class="text-decoration-none">
                        <i class="bi bi-person-plus"></i> 免费注册
                    </a>
                    <a href="{% url 'bookstore:password_reset' %}" class="text-decoration-none">
                        <i class="bi bi-question-circle"></i> 忘记密码？
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
