{% extends 'bookstore/base.html' %}
{% load static %}

{% block title %}密码重置{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <i class="bi bi-key"></i>
            <h2>重置密码</h2>
            <p class="text-white opacity-75">请输入用户名和新密码</p>
        </div>
        <div class="auth-body">
            {% if messages %}
                {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                {% endfor %}
            {% endif %}

            <form method="post" action="{% url 'bookstore:password_reset' %}">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="username" class="form-label">
                        <i class="bi bi-person me-1"></i>用户名
                    </label>
                    <input type="text" class="form-control" id="username" name="username"
                           placeholder="请输入用户名" required autofocus>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">
                        <i class="bi bi-lock me-1"></i>新密码
                    </label>
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="请输入新密码" required>
                </div>

                <div class="mb-4">
                    <label for="password2" class="form-label">
                        <i class="bi bi-lock-fill me-1"></i>确认新密码
                    </label>
                    <input type="password" class="form-control" id="password2" name="password2"
                           placeholder="请再次输入新密码" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 mb-3">
                    <i class="bi bi-check-circle"></i> 确认重置
                </button>

                <div class="text-center">
                    <a href="{% url 'bookstore:login' %}" class="text-primary text-decoration-none">
                        <i class="bi bi-arrow-left"></i> 返回登录
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
